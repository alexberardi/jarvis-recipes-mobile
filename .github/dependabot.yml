# Dependency updates. This repo shipped with no Dependabot at all — 29 deps,
# zero automated bumps, and third-party GitHub Actions floating on mutable tags
# in a workflow that pushes builds to TestFlight.
#
# github-actions is the ecosystem that matters most: a tag repoint on a
# third-party action runs attacker-controlled code inside the release job.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Expo-SDK-managed + React Native native modules: their versions are pinned
    # to the Expo SDK and MUST be bumped via `npx expo install` (an SDK upgrade),
    # NOT by dependabot. An off-SDK bump compiles fine but crashes the RELEASE
    # build at native-module init (black screen). Leave the whole native/SDK
    # surface to `expo install`.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-navigation/*"
      # The test/build toolchain is pinned to the Expo SDK too: jest-expo 54 is
      # built on Jest 29, babel-preset-expo tracks the SDK, and Expo pins
      # TypeScript ~5.9. Majors come in with an SDK upgrade; minors still flow.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
